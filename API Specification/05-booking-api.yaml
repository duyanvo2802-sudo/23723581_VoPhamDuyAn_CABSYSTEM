openapi: 3.0.4

info:
  title: CAB System - Booking API
  description: API đặt xe và tìm tài xế
  version: 1.0.0

servers:
  - url: http://localhost:8080/api

tags:
  - name: Booking
    description: Đặt xe và phân công tài xế

paths:

  /bookings:
    post:
      tags:
        - Booking
      summary: Tạo yêu cầu đặt xe
      operationId: createBooking

      security:
        - bearerAuth: []

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBookingRequest"

      responses:
        "201":
          description: Tạo yêu cầu đặt xe thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"

        "400":
          description: Dữ liệu đặt xe không hợp lệ

        "401":
          description: Chưa xác thực

        "404":
          description: Không tìm thấy tài xế phù hợp

  /bookings/{bookingId}:
    get:
      tags:
        - Booking
      summary: Xem thông tin đặt xe
      operationId: getBooking

      security:
        - bearerAuth: []

      parameters:
        - name: bookingId
          in: path
          required: true
          schema:
            type: string
          example: BOOK001

      responses:
        "200":
          description: Thông tin đặt xe
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"

        "404":
          description: Không tìm thấy yêu cầu

  /bookings/{bookingId}/cancel:
    post:
      tags:
        - Booking
      summary: Hủy yêu cầu đặt xe
      operationId: cancelBooking

      security:
        - bearerAuth: []

      parameters:
        - name: bookingId
          in: path
          required: true
          schema:
            type: string

      responses:
        "200":
          description: Hủy chuyến thành công

        "400":
          description: Không thể hủy chuyến

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    CreateBookingRequest:
      type: object
      required:
        - pickupLatitude
        - pickupLongitude
        - destinationLatitude
        - destinationLongitude
        - vehicleType
      properties:
        pickupLatitude:
          type: number
          format: double
          example: 10.7769

        pickupLongitude:
          type: number
          format: double
          example: 106.7009

        destinationLatitude:
          type: number
          format: double
          example: 10.8231

        destinationLongitude:
          type: number
          format: double
          example: 106.6297

        vehicleType:
          type: string
          example: CAR

    Booking:
      type: object
      properties:
        id:
          type: string
          example: BOOK001

        customerId:
          type: string
          example: CUS001

        driverId:
          type: string
          example: DRV001

        status:
          type: string
          enum:
            - SEARCHING_DRIVER
            - DRIVER_ASSIGNED
            - CANCELLED
            - FAILED

        pickupAddress:
          type: string
          example: 12 Nguyen Hue, District 1

        destinationAddress:
          type: string
          example: 100 Nguyen Trai, District 5

openapi: 3.0.4

info:
  title: CAB System - Rating API
  description: API đánh giá tài xế
  version: 1.0.0

servers:
  - url: http://localhost:8080/api

tags:
  - name: Rating
    description: Đánh giá tài xế

paths:

  /ratings:
    post:
      tags:
        - Rating
      summary: Đánh giá tài xế
      operationId: createRating

      security:
        - bearerAuth: []

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RatingRequest"

      responses:
        "201":
          description: Đánh giá thành công

        "400":
          description: Chuyến chưa hoàn thành hoặc dữ liệu không hợp lệ

        "409":
          description: Khách hàng đã đánh giá chuyến này

  /ratings/driver/{driverId}:
    get:
      tags:
        - Rating
      summary: Xem đánh giá của tài xế
      operationId: getDriverRatings

      security:
        - bearerAuth: []

      parameters:
        - name: driverId
          in: path
          required: true
          schema:
            type: string
          example: DRV001

      responses:
        "200":
          description: Danh sách đánh giá
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Rating"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    RatingRequest:
      type: object
      required:
        - tripId
        - driverId
        - score
      properties:
        tripId:
          type: string
          example: TRIP001
        driverId:
          type: string
          example: DRV001
        score:
          type: integer
          minimum: 1
          maximum: 5
          example: 5
        comment:
          type: string
          example: Tài xế rất thân thiện.

    Rating:
      allOf:
        - $ref: "#/components/schemas/RatingRequest"
        - type: object
          properties:
            id:
              type: string
              example: RATE001
            createdAt:
              type: string
              format: date-time
